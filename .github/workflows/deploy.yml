name: Publish Rootwise (manual)
# GitHub currently refuses custom jobs because of an account billing lock.
# Do not trigger failing jobs on every source push. Use npm run deploy locally.
# Once billing is resolved, this optional manual workflow can be dispatched.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rootwise-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deploy
